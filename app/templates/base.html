<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    @keyframes scrollGrid {
        from { background-position: 0 0; }
        to { background-position: 0 40px; }
    }
    .anime-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        animation: scrollGrid 4s linear infinite;
    }
</style>
</head>
<body class="bg-gradient-to-tr from-slate-900 via-slate-950 to-indigo-950 min-h-screen flex flex-col justify-between text-white overflow-x-hidden relative">

    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 anime-grid opacity-80"></div>
        <div class="absolute top-1/3 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 right-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="fixed top-4 right-4 z-50 max-w-sm w-full space-y-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-4 rounded-xl shadow-lg border text-sm flex items-center justify-between backdrop-blur-md transition-all duration-300
                        {% if category == 'success' %} bg-emerald-950/80 text-emerald-300 border-emerald-800/50
                        {% elif category == 'danger' %} bg-rose-950/80 text-rose-300 border-rose-800/50
                        {% else %} bg-blue-950/80 text-blue-300 border-blue-800/50 {% endif %}">
                        <span>{{ message }}</span>
                        <button onclick="this.parentElement.remove()" class="ml-3 font-semibold opacity-50 hover:opacity-100">&times;</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <main class="flex-grow flex items-center justify-center p-4 z-10">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
