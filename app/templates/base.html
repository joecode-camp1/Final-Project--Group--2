<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    @keyframes scrollGrid {
        from { background-position: 0 0; }
        to { background-position: 0 40px; }
    }
    .anime-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        animation: scrollGrid 4s linear infinite;
    }
</style>
</head>
<body class="bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950 min-h-screen flex flex-col justify-between text-slate-100 overflow-x-hidden relative selection:bg-blue-500/30 selection:text-blue-200 antialiased font-sans">

    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 anime-grid opacity-[0.12] mix-blend-overlay"></div>
        
        <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[140px] animate-pulse duration-[8s]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[160px] animate-pulse duration-[12s]"></div>
        
        <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
    </div>

    <div class="fixed top-6 right-6 z-50 max-w-sm w-full space-y-3 pointer-events-none">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="pointer-events-auto p-4 rounded-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] border backdrop-blur-xl flex items-start justify-between transition-all duration-300 transform translate-y-0 scale-100 hover:scale-[1.02]
                        {% if category == 'success' %} bg-emerald-950/40 text-emerald-200 border-emerald-500/20 shadow-emerald-950/20
                        {% elif category == 'danger' %} bg-rose-950/40 text-rose-200 border-rose-500/20 shadow-rose-950/20
                        {% else %} bg-blue-950/40 text-blue-200 border-blue-500/20 shadow-blue-950/20 {% endif %}"
                         id="flash-toast-{{ loop.index }}">
                        
                        <div class="flex items-center gap-3">
                            <span class="text-base">
                                {% if category == 'success' %}🟢{% elif category == 'danger' %}🚨{% else %}ℹ️{% endif %}
                            </span>
                            <p class="text-xs font-medium tracking-wide leading-relaxed">{{ message }}</p>
                        </div>

                        <button onclick="dismissToast('flash-toast-{{ loop.index }}')" 
                                class="ml-4 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all focus:outline-none cursor-pointer">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <main class="flex-grow flex items-center justify-center p-6 md:p-12 z-10 w-full max-w-7xl mx-auto">
        <div class="w-full flex justify-center items-center transition-all duration-500">
            {% block content %}{% endblock %}
        </div>
    </main>

   <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
